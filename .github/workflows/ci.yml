name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:play
      - run: npm run build:map
      - name: Balance lab
        run: npm run lab -- --runs 300 --out lab-reports/ci.md > /dev/null && cat lab-reports/ci.md >> "$GITHUB_STEP_SUMMARY"
